<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kwynumbra</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#9b59b6">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 0.75em;
    margin-bottom: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  #connect-btn {
    width: 100%;
    max-width: 400px;
    padding: 14px;
    font-size: 1.1em;
    font-weight: 600;
    border: 2px solid #9b59b6;
    background: transparent;
    color: #9b59b6;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  #connect-btn:active { background: #9b59b6; color: #fff; }
  #connect-btn.connected { background: #9b59b6; color: #fff; }
  #controls { display: none; width: 100%; max-width: 400px; }

  /* Sliders */
  .slider-row {
    margin-bottom: 14px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 0.8em;
    color: #666;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 36px;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    background: #333;
    border-radius: 3px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    background: #9b59b6;
    border-radius: 50%;
    margin-top: -11px;
  }

  /* BPM stepper */
  .bpm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .bpm-label { font-size: 0.8em; color: #666; }
  .bpm-controls { display: flex; align-items: center; gap: 12px; }
  .bpm-btn {
    width: 40px;
    height: 40px;
    border: 2px solid #333;
    background: #1a1a1a;
    color: #ccc;
    border-radius: 10px;
    font-size: 1.4em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bpm-btn:active { background: #333; }
  /* Mic */
  .mic-btn {
    padding: 9px 18px;
    border: 2px solid #333;
    background: #1a1a1a;
    color: #ccc;
    border-radius: 10px;
    font-size: 0.85em;
    font-weight: 600;
    cursor: pointer;
  }
  .mic-btn.on { border-color: #9b59b6; background: #2a1a33; color: #fff; }
  /* Live band levels. Without them a denied mic, a too-quiet room and a dead
     BLE link are indistinguishable from across the room. */
  .mic-meter { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
  .mic-meter i { width: 5px; height: 2px; background: #9b59b6; border-radius: 2px; }

  .bpm-value {
    font-size: 1.5em;
    font-weight: 700;
    min-width: 50px;
    text-align: center;
  }

  /* Color presets */
  .presets-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .preset-btn {
    padding: 8px 4px;
    border: 2px solid #333;
    background: #1a1a1a;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .preset-btn:active { transform: scale(0.95); }
  .preset-btn.active {
    border-color: #9b59b6;
    background: #2a1a3a;
    box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
  }
  .preset-dots {
    display: flex;
    gap: 3px;
    justify-content: center;
    margin-bottom: 4px;
  }
  .preset-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .preset-label {
    font-size: 0.7em;
    color: #999;
    font-weight: 600;
  }

  /* Custom color pickers */
  .custom-colors {
    display: none;
    justify-content: center;
    gap: 20px;
    margin-bottom: 14px;
    padding: 10px 0;
  }
  .custom-colors.visible { display: flex; }
  .color-pick {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .color-pick input[type="color"] {
    -webkit-appearance: none;
    width: 48px;
    height: 48px;
    border: 2px solid #444;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .color-pick input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .color-pick input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: none; }
  .color-pick label { font-size: 0.65em; color: #666; }
  /* Unchecking Color 3 gives a two-colour chase. */
  .color-pick label input[type="checkbox"] { accent-color: #9b59b6; vertical-align: middle; }
  .color-pick input[type="color"]:disabled { opacity: 0.25; }

  /* Effects grid */
  .effects-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .effect-btn {
    padding: 18px 10px;
    font-size: 1em;
    font-weight: 600;
    border: 2px solid #333;
    background: #1a1a1a;
    color: #ccc;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .effect-btn:active { transform: scale(0.95); }
  /* Odd button out spans the row rather than sitting as a lonely half. */
  .effect-btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .effect-btn.active {
    border-color: #9b59b6;
    background: #2a1a3a;
    color: #fff;
    box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
  }
  .effect-btn .emoji { font-size: 1.3em; display: block; margin-bottom: 2px; }
  #status { margin-top: 12px; font-size: 0.75em; color: #555; }
</style>
</head>
<body>

<h1>Kwynumbra</h1>
<button id="connect-btn">Connect to Kwynumbra</button>

<div id="controls">
  <!-- Brightness -->
  <div class="slider-row">
    <div class="slider-label">
      <span>Brightness</span>
      <span id="brightness-val">128</span>
    </div>
    <input type="range" id="brightness" min="0" max="128" value="128">
  </div>

  <!-- BPM -->
  <div class="bpm-row">
    <span class="bpm-label">BPM</span>
    <div class="bpm-controls">
      <button class="bpm-btn" id="bpm-down">&minus;</button>
      <span class="bpm-value" id="bpm-val">128</span>
      <button class="bpm-btn" id="bpm-up">+</button>
    </div>
  </div>

  <!-- Mic: the phone listens and streams the analysis to the horns -->
  <div class="bpm-row">
    <span class="bpm-label">Listen</span>
    <div class="bpm-controls">
      <span class="mic-meter"><i id="mic-b"></i><i id="mic-m"></i><i id="mic-h"></i></span>
      <button class="mic-btn" id="mic-btn">Off</button>
    </div>
  </div>

  <!-- Color Presets -->
  <div class="presets-grid">
    <button class="preset-btn" data-preset="trans">
      <div class="preset-dots">
        <span class="preset-dot" style="background:#F5A9B8"></span>
        <span class="preset-dot" style="background:#5BCEFA"></span>
        <span class="preset-dot" style="background:#FFFFFF"></span>
      </div>
      <span class="preset-label">Trans</span>
    </button>
    <button class="preset-btn active" data-preset="cyber">
      <div class="preset-dots">
        <span class="preset-dot" style="background:#9B59B6"></span>
        <span class="preset-dot" style="background:#00CED1"></span>
        <span class="preset-dot" style="background:#FF69B4"></span>
      </div>
      <span class="preset-label">Cyber</span>
    </button>
    <button class="preset-btn" data-preset="fire">
      <div class="preset-dots">
        <span class="preset-dot" style="background:#FF0000"></span>
        <span class="preset-dot" style="background:#FF8C00"></span>
        <span class="preset-dot" style="background:#FFD700"></span>
      </div>
      <span class="preset-label">Fire</span>
    </button>
    <button class="preset-btn" data-preset="custom">
      <div class="preset-dots">
        <span class="preset-dot" style="background:#888;border:1px solid #555"></span>
        <span class="preset-dot" style="background:#888;border:1px solid #555"></span>
        <span class="preset-dot" style="background:#888;border:1px solid #555"></span>
      </div>
      <span class="preset-label">Custom</span>
    </button>
  </div>

  <!-- Custom Color Pickers (hidden until Custom selected) -->
  <div class="custom-colors" id="custom-colors">
    <div class="color-pick">
      <input type="color" id="color1" value="#9B59B6">
      <label>Color 1</label>
    </div>
    <div class="color-pick">
      <input type="color" id="color2" value="#00CED1">
      <label>Color 2</label>
    </div>
    <div class="color-pick">
      <input type="color" id="color3" value="#FF69B4">
      <label><input type="checkbox" id="color3-on" checked> Color 3</label>
    </div>
  </div>

  <!-- Effects -->
  <div class="effects-grid">
    <button class="effect-btn active" data-effect="0">
      <span class="emoji">&#x1F308;</span>Rainbow
    </button>
    <button class="effect-btn" data-effect="1">
      <span class="emoji">&#x1F3C1;</span>Chase
    </button>
    <button class="effect-btn" data-effect="2">
      <span class="emoji">&#x1F941;</span>Bass Pulse
    </button>
    <button class="effect-btn" data-effect="4">
      <span class="emoji">&#x1F30B;</span>Bass Bloom
    </button>
    <button class="effect-btn" data-effect="3">
      <span class="emoji">&#x1F3B5;</span>Spectrum
    </button>
    <button class="effect-btn" data-effect="5">
      <span class="emoji">&#x1F30A;</span>Flow
    </button>
  </div>
</div>

<div id="status"></div>

<script>
const SERVICE_UUID         = '19b10000-e8f2-537e-4f6c-d104768a1214';
const EFFECT_CHAR_UUID     = '19b10001-e8f2-537e-4f6c-d104768a1214';
const BRIGHTNESS_CHAR_UUID = '19b10002-e8f2-537e-4f6c-d104768a1214';
const COLOR1_CHAR_UUID     = '19b10003-e8f2-537e-4f6c-d104768a1214';
const COLOR2_CHAR_UUID     = '19b10004-e8f2-537e-4f6c-d104768a1214';
const COLOR3_CHAR_UUID     = '19b10005-e8f2-537e-4f6c-d104768a1214';
const BPM_CHAR_UUID        = '19b10006-e8f2-537e-4f6c-d104768a1214';
const COLORCOUNT_CHAR_UUID = '19b10007-e8f2-537e-4f6c-d104768a1214';
const AUDIO_CHAR_UUID      = '19b10008-e8f2-537e-4f6c-d104768a1214';

const PRESETS = {
  trans:  ['#F5A9B8', '#5BCEFA', '#FFFFFF'],
  cyber:  ['#9B59B6', '#00CED1', '#FF69B4'],
  fire:   ['#FF0000', '#FF8C00', '#FFD700'],
};

let effectChar = null;
let brightnessChar = null;
let color1Char = null;
let color2Char = null;
let color3Char = null;
let bpmChar = null;
let colorCountChar = null;
let audioChar = null;

const connectBtn = document.getElementById('connect-btn');
const controls = document.getElementById('controls');
const brightnessSlider = document.getElementById('brightness');
const brightnessVal = document.getElementById('brightness-val');
const bpmVal = document.getElementById('bpm-val');
const bpmDown = document.getElementById('bpm-down');
const bpmUp = document.getElementById('bpm-up');
const customColors = document.getElementById('custom-colors');
const color3On = document.getElementById('color3-on');
const colorInputs = [
  document.getElementById('color1'),
  document.getElementById('color2'),
  document.getElementById('color3'),
];
const status = document.getElementById('status');
const effectBtns = document.querySelectorAll('.effect-btn');
const presetBtns = document.querySelectorAll('.preset-btn');

let currentBPM = 128;
// Cleared by the manual +/- buttons so tempo detection can't fight a deliberate
// nudge; toggling Listen back on re-arms it.
let autoBPM = true;

function setStatus(msg) { status.textContent = msg; }

function hexToRgb(hex) {
  const r = parseInt(hex.substr(1, 2), 16);
  const g = parseInt(hex.substr(3, 2), 16);
  const b = parseInt(hex.substr(5, 2), 16);
  return [r, g, b];
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

// Web Bluetooth allows exactly one GATT operation at a time per device, so
// every write has to go through one gate. Without it, nudging brightness while
// the mic is streaming throws "GATT operation already in progress" on both —
// which only shows up once something writes continuously.
let gattBusy = false;
const gattQueue = [];

function pumpGatt() {
  if (gattBusy || !gattQueue.length) return;
  gattBusy = true;
  gattQueue.shift()()
    .catch(err => setStatus('Write error: ' + err.message))
    .finally(() => { gattBusy = false; pumpGatt(); });
}

// Control writes queue — a dropped brightness change is a bug.
function gattWrite(char, bytes) {
  if (!char) return;
  gattQueue.push(() => char.writeValue(bytes));
  pumpGatt();
}

// Audio drops rather than queues. A queued frame is already stale by the time
// it lands, and queueing every frame is exactly the unbounded backlog this is
// meant to prevent.
function gattStream(char, bytes) {
  if (!char || gattBusy || gattQueue.length) return;
  gattBusy = true;
  // Without-response: a per-frame round trip chokes at this rate.
  const w = char.writeValueWithoutResponse
    ? char.writeValueWithoutResponse(bytes)
    : char.writeValue(bytes);
  w.catch(() => {})   // transient; the next frame carries fresher data
   .finally(() => { gattBusy = false; pumpGatt(); });
}

function writeColor(char, hex) {
  const [r, g, b] = hexToRgb(hex);
  gattWrite(char, new Uint8Array([r, g, b]));
}

function writeColorCount(n) {
  gattWrite(colorCountChar, new Uint8Array([n]));
}

function writeBPM(val) {
  gattWrite(bpmChar, new Uint8Array([val]));
}

// Cache the page for offline use. Failure is not worth surfacing — it only
// costs offline support, and BLE control still works while the page is loaded.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Connect
connectBtn.addEventListener('click', async () => {
  try {
    setStatus('Scanning...');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: ['battery_service'],
    });

    device.addEventListener('gattserverdisconnected', () => {
      connectBtn.textContent = 'Reconnect';
      connectBtn.classList.remove('connected');
      controls.style.display = 'none';
      setStatus('Disconnected');
    });

    setStatus('Connecting...');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    effectChar = await service.getCharacteristic(EFFECT_CHAR_UUID);
    brightnessChar = await service.getCharacteristic(BRIGHTNESS_CHAR_UUID);
    color1Char = await service.getCharacteristic(COLOR1_CHAR_UUID);
    color2Char = await service.getCharacteristic(COLOR2_CHAR_UUID);
    color3Char = await service.getCharacteristic(COLOR3_CHAR_UUID);
    bpmChar = await service.getCharacteristic(BPM_CHAR_UUID);
    colorCountChar = await service.getCharacteristic(COLORCOUNT_CHAR_UUID);
    audioChar = await service.getCharacteristic(AUDIO_CHAR_UUID);

    // Sync UI from device state
    const effectVal = (await effectChar.readValue()).getUint8(0);
    const brightVal = (await brightnessChar.readValue()).getUint8(0);
    const bpmVal2 = (await bpmChar.readValue()).getUint8(0);
    const countVal = (await colorCountChar.readValue()).getUint8(0);

    const c1 = await color1Char.readValue();
    const c2 = await color2Char.readValue();
    const c3 = await color3Char.readValue();

    effectBtns.forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.effect) === effectVal);
    });
    brightnessSlider.value = brightVal;
    brightnessVal.textContent = brightVal;
    currentBPM = bpmVal2;
    bpmVal.textContent = currentBPM;

    colorInputs[0].value = rgbToHex(c1.getUint8(0), c1.getUint8(1), c1.getUint8(2));
    colorInputs[1].value = rgbToHex(c2.getUint8(0), c2.getUint8(1), c2.getUint8(2));
    // Colour 3 keeps its real value on the wire whether or not it's in use, so
    // the picker always restores to a real colour and the count says what's live.
    colorInputs[2].value = rgbToHex(c3.getUint8(0), c3.getUint8(1), c3.getUint8(2));
    color3On.checked = countVal === 3;
    colorInputs[2].disabled = countVal !== 3;

    connectBtn.textContent = 'Connected';
    connectBtn.classList.add('connected');
    controls.style.display = 'block';
    setStatus('');

    // Standard Battery Service. Reuses the status line, which is empty once
    // connected. Wrapped so older firmware without it still connects fine.
    try {
      const batteryChar = await (await server.getPrimaryService('battery_service'))
        .getCharacteristic('battery_level');
      const show = v => setStatus(`Battery ${v.getUint8(0)}%`);
      batteryChar.addEventListener('characteristicvaluechanged', e => show(e.target.value));
      await batteryChar.startNotifications();
      show(await batteryChar.readValue());
    } catch (err) {
      setStatus('Battery unavailable');
    }
  } catch (err) {
    setStatus('Error: ' + err.message);
  }
});

// Effects
effectBtns.forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!effectChar) return;
    const idx = parseInt(btn.dataset.effect);
    gattWrite(effectChar, new Uint8Array([idx]));
    effectBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Brightness
brightnessSlider.addEventListener('input', () => {
  const val = parseInt(brightnessSlider.value);
  brightnessVal.textContent = val;
  gattWrite(brightnessChar, new Uint8Array([val]));
});

// BPM
bpmDown.addEventListener('click', () => {
  autoBPM = false;
  if (currentBPM > 60) {
    currentBPM--;
    bpmVal.textContent = currentBPM;
    writeBPM(currentBPM);
  }
});
bpmUp.addEventListener('click', () => {
  autoBPM = false;
  if (currentBPM < 200) {
    currentBPM++;
    bpmVal.textContent = currentBPM;
    writeBPM(currentBPM);
  }
});

// Presets
presetBtns.forEach(btn => {
  btn.addEventListener('click', async () => {
    presetBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const preset = btn.dataset.preset;

    if (preset === 'custom') {
      customColors.classList.add('visible');
      return;
    }

    customColors.classList.remove('visible');
    const colors = PRESETS[preset];
    if (!colors) return;

    colorInputs[0].value = colors[0];
    colorInputs[1].value = colors[1];
    colorInputs[2].value = colors[2];

    // A preset supplies all three colors, so it turns Color 3 back on.
    color3On.checked = true;
    colorInputs[2].disabled = false;

    await writeColor(color1Char, colors[0]);
    await writeColor(color2Char, colors[1]);
    await writeColor(color3Char, colors[2]);
    await writeColorCount(3);
  });
});

// Custom color pickers
const colorChars = () => [color1Char, color2Char, color3Char];
colorInputs.forEach((input, i) => {
  input.addEventListener('input', () => {
    writeColor(colorChars()[i], input.value);
  });
});

// Color 3 off = two-color chase. The count says how many colours are live;
// colour 3 keeps its own value, so black is now just a colour you can pick.
color3On.addEventListener('change', () => {
  colorInputs[2].disabled = !color3On.checked;
  writeColorCount(color3On.checked ? 3 : 2);
});

// --- Mic: the phone is the microphone ---------------------------------------
// All the DSP lives here rather than on the board. The horns just render what
// arrives; see CLAUDE.md for why the on-device FFT was dropped.

// fftSize 2048 at 48kHz is ~23.4Hz per bin.
//
// These are pitched far lower than a textbook bass/mid/treble split, and
// deliberately so — measured with test/../web/mictest.html against real tracks
// through a phone mic in a room:
//
//     region    peak      variation
//     40Hz      -69dB       31dB
//     630Hz     -85dB       15dB
//     1.25k     -90dB       10dB
//     2.5k      -95dB        4dB
//     5k        -98dB        2dB     <- floored
//     10k       -97dB        3dB     <- floored
//
// Everything above ~2.5kHz sits within a few dB of the analyser's floor: a
// phone mic, a room, and bass-heavy material together leave nothing rhythmic up
// there. A "high" band of 2-8kHz was averaging pure noise, which is why it read
// as permanent silence. The usable brightness information is 630Hz-2.5kHz.
// ponytail: measured, not derived. Re-run the probe if the mic or venue changes.
const BANDS = [[1, 6], [7, 26], [27, 106]];   // 23-164Hz, 164-632Hz, 632-2.5kHz

// ponytail: feel knobs, every one of them. Tune against real tracks on the
// actual horns — a phone mic in a club is not a phone mic on a desk.
const GAIN_TAU_MS   = 8000;   // how fast a band's floor/peak forget a moment
const MIN_SPAN      = 8;      // byte range a band must move before it counts as fully live
const BALANCE_TAU_MS = 30000; // what "usual brightness" means; spans a set, not a track
const BALANCE_RANGE  = 40;    // byte swing away from usual that reads as fully warm/cold
const BASS_TAU_MS   = 300;    // onset baseline; longer means only sharper hits count
const TEMPO_HZ      = 50;     // fixed tempo-buffer rate, independent of rAF's wobble
const TEMPO_SECONDS = 6;
// A search range narrower than one octave cannot produce an octave error, which
// is autocorrelation's classic failure mode — 140bpm confidently reported as 70.
// This covers essentially all DJ music; manual +/- still reaches the full 60-200.
const TEMPO_MIN = 90, TEMPO_MAX = 179;
const TEMPO_MIN_SCORE = 0.004;   // below this, the room isn't carrying a beat

let listening = false;
let micStream = null, micCtx = null, micRAF = 0;

// Per-band level, normalised against that band's OWN working range.
//
// A single absolute threshold cannot work here. Spectral energy rolls off with
// frequency and the bands are wildly different widths — bass averages 8 bins
// that are all hot, high averages 256 bins across 2-8kHz that mostly are not.
// A floor tuned for one sits above the whole of the other and pins it to zero
// forever, which is how the high band came to read as permanent silence.
//
// Returns raw alongside level, because spectral balance has to come from the
// raw dB-mapped values. Auto-gained levels cannot answer "where does the energy
// sit": each is normalised to its own range, so a sub-only track and a bright
// one both peg every band at 1.0 once they get loud.
function makeBandTracker() {
  const floors = [255, 255, 255];
  const peaks = [0, 0, 0];
  let balanceAvg = null;

  return function track(bins, dt) {
    const settle = 1 - Math.exp(-dt / GAIN_TAU_MS);

    const raw = BANDS.map(([lo, hi]) => {
      let sum = 0;
      for (let j = lo; j <= hi; j++) sum += bins[j];
      return sum / (hi - lo + 1);
    });

    const level = raw.map((v, i) => {
      // Floor drops straight to a new quiet and creeps back up; peak jumps to a
      // new loud and decays back down. Between them is this band's own range,
      // wherever it happens to sit in absolute terms.
      floors[i] = v < floors[i] ? v : floors[i] + (v - floors[i]) * settle;
      peaks[i] = v > peaks[i] ? v : peaks[i] - (peaks[i] - v) * settle;
      const span = peaks[i] - floors[i];
      if (span <= 0) return 0;
      // Fade a barely-moving band in rather than gating it. A hard threshold
      // makes a band snap between silent and fully live, and the measured spans
      // sit close enough to it that a band would flicker across the boundary.
      const confidence = Math.min(1, span / MIN_SPAN);
      return confidence * Math.min(1, Math.max(0, (v - floors[i]) / span));
    });

    // Where the energy sits, in byte units that are already dB-mapped. Centred
    // on its own long-run average so it reads as "brighter or darker than this
    // room and this mic usually are" — an absolute would sit permanently
    // negative thanks to spectral rolloff and the phone mic's own response.
    const balance = raw[2] - raw[0];
    if (balanceAvg === null) balanceAvg = balance;
    else balanceAvg += (balance - balanceAvg) * (1 - Math.exp(-dt / BALANCE_TAU_MS));
    const tilt = Math.max(-1, Math.min(1, (balance - balanceAvg) / BALANCE_RANGE));

    return { raw, level, tilt };
  };
}

const micBtn = document.getElementById('mic-btn');
const micBars = ['mic-b', 'mic-m', 'mic-h'].map(id => document.getElementById(id));

async function startListening() {
  // The speech-tuned defaults actively fight bass content — AGC in particular
  // pumps sub against mids and flattens the spectral tilt into nothing.
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { autoGainControl: false, echoCancellation: false, noiseSuppression: false },
  });

  micCtx = new AudioContext();
  // iOS hands back a suspended context unless it's resumed in a user gesture.
  if (micCtx.state === 'suspended') await micCtx.resume();

  const an = micCtx.createAnalyser();
  an.fftSize = 2048;
  an.smoothingTimeConstant = 0;   // each signal below does its own smoothing
  // Narrowing the dB window is a gain control: it maps the same dB range onto
  // more bytes, so a band that moves only a few dB still produces a usable
  // span. Widening it would have been the intuitive fix and is exactly wrong —
  // more range means fewer bytes per dB, and span is what everything downstream
  // feeds on. -50 keeps headroom above the -69dB peak measured in the room.
  // ponytail: gain knob. Lower the top if it saturates at gig volume.
  an.maxDecibels = -50;
  micCtx.createMediaStreamSource(micStream).connect(an);

  const bins = new Uint8Array(an.frequencyBinCount);
  const bandTracker = makeBandTracker();
  const tempoBuf = new Float32Array(TEMPO_HZ * TEMPO_SECONDS);
  const out = new Uint8Array(5);
  let bassSlow = 0, kickPeak = 0.02;
  let tempoIdx = 0, tempoAcc = 0, tempoMax = 0;
  let bpmGuess = 0, bpmRepeat = 0;
  let lastT = 0, lastMeterT = 0, lastTempoT = 0;

  // Lag range in buffer samples. Longer lag = slower tempo.
  const lagMin = Math.floor(TEMPO_HZ * 60 / TEMPO_MAX);
  const lagMax = Math.ceil(TEMPO_HZ * 60 / TEMPO_MIN);

  function estimateBPM() {
    const n = tempoBuf.length;
    let bestLag = 0, bestScore = 0;
    for (let lag = lagMin; lag <= lagMax; lag++) {
      let sum = 0;
      for (let i = 0; i < n - lag; i++) {
        sum += tempoBuf[(tempoIdx + i) % n] * tempoBuf[(tempoIdx + i + lag) % n];
      }
      // Longer lags compare fewer pairs, so without this slow tempos can never win.
      sum /= (n - lag);
      if (sum > bestScore) { bestScore = sum; bestLag = lag; }
    }
    return bestScore < TEMPO_MIN_SCORE ? 0 : Math.round(TEMPO_HZ * 60 / bestLag);
  }

  function frame(t) {
    micRAF = requestAnimationFrame(frame);
    // Clamped: a backgrounded tab resumes with a huge dt that would otherwise
    // slam every smoothed value straight to its target.
    const dt = lastT ? Math.min(t - lastT, 100) : 16;
    lastT = t;

    an.getByteFrequencyData(bins);
    const forget = Math.exp(-dt / GAIN_TAU_MS);
    const { level: band, tilt } = bandTracker(bins, dt);

    // Kick is a bass *onset*, not a bass level. Sustained sub — a reece, a
    // wobble — holds band[0] high for a whole drop, so only the rise above the
    // recent average is an actual hit.
    bassSlow += (band[0] - bassSlow) * (1 - Math.exp(-dt / BASS_TAU_MS));
    const flux = Math.max(0, band[0] - bassSlow);
    kickPeak = Math.max(flux, kickPeak * forget, 0.02);
    const kick = Math.min(1, flux / kickPeak);

    out[0] = kick * 255;
    out[1] = band[0] * 255;
    out[2] = band[1] * 255;
    out[3] = band[2] * 255;
    out[4] = (tilt + 1) * 127.5;   // -1..+1 -> 0..255, 128 is neutral
    gattStream(audioChar, out);

    // Resample onsets to a fixed rate so autocorrelation sees an even timebase.
    // Max rather than last, so a transient between samples isn't dropped.
    tempoMax = Math.max(tempoMax, kick);
    tempoAcc += dt;
    while (tempoAcc >= 1000 / TEMPO_HZ) {
      tempoAcc -= 1000 / TEMPO_HZ;
      tempoBuf[tempoIdx++ % tempoBuf.length] = tempoMax;
      tempoMax = 0;
    }

    if (autoBPM && t - lastTempoT > 500) {
      lastTempoT = t;
      const est = estimateBPM();
      // Require the same answer a few times running — a single autocorrelation
      // peak on a fill or a breakdown is not a tempo.
      if (est && Math.abs(est - bpmGuess) <= 1) bpmRepeat++;
      else { bpmGuess = est; bpmRepeat = 0; }
      if (bpmRepeat >= 3 && Math.abs(est - currentBPM) >= 2) {
        currentBPM = est;
        bpmVal.textContent = est;
        writeBPM(est);
      }
    }

    if (t - lastMeterT > 80) {
      lastMeterT = t;
      micBars.forEach((el, i) => { el.style.height = (2 + band[i] * 22) + 'px'; });
    }
  }
  micRAF = requestAnimationFrame(frame);
}

async function stopListening() {
  cancelAnimationFrame(micRAF);
  if (micStream) micStream.getTracks().forEach(tr => tr.stop());
  if (micCtx) micCtx.close();
  micStream = micCtx = null;
  micBars.forEach(el => { el.style.height = '2px'; });
  // The firmware's staleness timeout catches this within half a second anyway,
  // but an explicit zero makes "off" instant. Queued, not streamed, so it can't
  // be dropped for being the one write that arrived while the gate was busy.
  gattWrite(audioChar, new Uint8Array([0, 0, 0, 0, 128]));
}

micBtn.addEventListener('click', async () => {
  if (listening) {
    listening = false;
    micBtn.textContent = 'Off';
    micBtn.classList.remove('on');
    await stopListening();
    return;
  }
  try {
    // This click is the user gesture iOS requires to open an AudioContext.
    await startListening();
    listening = true;
    autoBPM = true;   // re-enable tempo detection that a manual nudge switched off
    micBtn.textContent = 'On';
    micBtn.classList.add('on');
    setStatus('');
  } catch (err) {
    setStatus('Mic: ' + err.name + ' — ' + err.message);
  }
});
</script>

</body>
</html>
