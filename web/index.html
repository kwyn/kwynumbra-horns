<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kwynumbra</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 1.2em;
    margin-bottom: 16px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  #connect-btn {
    width: 100%;
    max-width: 400px;
    padding: 18px;
    font-size: 1.2em;
    font-weight: 600;
    border: 2px solid #9b59b6;
    background: transparent;
    color: #9b59b6;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 24px;
    transition: all 0.2s;
  }
  #connect-btn:active { background: #9b59b6; color: #fff; }
  #connect-btn.connected { background: #9b59b6; color: #fff; border-color: #9b59b6; }
  #controls { display: none; width: 100%; max-width: 400px; }
  .slider-container {
    margin-bottom: 24px;
    padding: 0 4px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.9em;
    color: #888;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 44px;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    background: #333;
    border-radius: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 36px;
    height: 36px;
    background: #9b59b6;
    border-radius: 50%;
    margin-top: -14px;
    cursor: pointer;
  }
  .effects-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .effect-btn {
    padding: 20px 12px;
    font-size: 1.1em;
    font-weight: 600;
    border: 2px solid #333;
    background: #1a1a1a;
    color: #ccc;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.3;
  }
  .effect-btn:active { transform: scale(0.95); }
  .effect-btn.active {
    border-color: #9b59b6;
    background: #2a1a3a;
    color: #fff;
    box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
  }
  .effect-btn .emoji { font-size: 1.4em; display: block; margin-bottom: 4px; }
  #status {
    margin-top: 16px;
    font-size: 0.8em;
    color: #555;
  }
</style>
</head>
<body>

<h1>Kwynumbra</h1>
<button id="connect-btn">Connect to Kwynumbra</button>

<div id="controls">
  <div class="slider-container">
    <div class="slider-label">
      <span>Brightness</span>
      <span id="brightness-val">128</span>
    </div>
    <input type="range" id="brightness" min="0" max="128" value="128">
  </div>

  <div class="effects-grid">
    <button class="effect-btn active" data-effect="0">
      <span class="emoji">🌈</span>Rainbow
    </button>
    <button class="effect-btn" data-effect="1">
      <span class="emoji">🔥</span>Fire
    </button>
    <button class="effect-btn" data-effect="2">
      <span class="emoji">💜</span>Pulse
    </button>
    <button class="effect-btn" data-effect="3">
      <span class="emoji">✨</span>Sparkle
    </button>
    <button class="effect-btn" data-effect="4">
      <span class="emoji">⬜</span>Solid
    </button>
    <button class="effect-btn" data-effect="5">
      <span class="emoji">🥁</span>Bass Pulse
    </button>
    <button class="effect-btn" data-effect="6">
      <span class="emoji">🎵</span>Spectrum
    </button>
  </div>
</div>

<div id="status"></div>

<script>
const SERVICE_UUID        = '19b10000-e8f2-537e-4f6c-d104768a1214';
const EFFECT_CHAR_UUID    = '19b10001-e8f2-537e-4f6c-d104768a1214';
const BRIGHTNESS_CHAR_UUID = '19b10002-e8f2-537e-4f6c-d104768a1214';

let effectChar = null;
let brightnessChar = null;

const connectBtn = document.getElementById('connect-btn');
const controls = document.getElementById('controls');
const brightnessSlider = document.getElementById('brightness');
const brightnessVal = document.getElementById('brightness-val');
const status = document.getElementById('status');
const effectBtns = document.querySelectorAll('.effect-btn');

function setStatus(msg) { status.textContent = msg; }

connectBtn.addEventListener('click', async () => {
  try {
    setStatus('Scanning...');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });

    device.addEventListener('gattserverdisconnected', () => {
      connectBtn.textContent = 'Reconnect';
      connectBtn.classList.remove('connected');
      controls.style.display = 'none';
      setStatus('Disconnected');
    });

    setStatus('Connecting...');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    effectChar = await service.getCharacteristic(EFFECT_CHAR_UUID);
    brightnessChar = await service.getCharacteristic(BRIGHTNESS_CHAR_UUID);

    // Read current values
    const effectVal = (await effectChar.readValue()).getUint8(0);
    const brightVal = (await brightnessChar.readValue()).getUint8(0);

    // Update UI to match device state
    effectBtns.forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.effect) === effectVal);
    });
    brightnessSlider.value = brightVal;
    brightnessVal.textContent = brightVal;

    connectBtn.textContent = 'Connected';
    connectBtn.classList.add('connected');
    controls.style.display = 'block';
    setStatus('');
  } catch (err) {
    setStatus('Error: ' + err.message);
  }
});

effectBtns.forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!effectChar) return;
    const idx = parseInt(btn.dataset.effect);
    try {
      await effectChar.writeValue(new Uint8Array([idx]));
      effectBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } catch (err) {
      setStatus('Write error: ' + err.message);
    }
  });
});

brightnessSlider.addEventListener('input', async () => {
  const val = parseInt(brightnessSlider.value);
  brightnessVal.textContent = val;
  if (!brightnessChar) return;
  try {
    await brightnessChar.writeValue(new Uint8Array([val]));
  } catch (err) {
    setStatus('Write error: ' + err.message);
  }
});
</script>

</body>
</html>
